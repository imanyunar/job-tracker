services:
  mysql:
    image: 'mysql:8.0'
    container_name: job_tracker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-root}'
      MYSQL_DATABASE: '${DB_DATABASE:-job_tracker}'
      MYSQL_USER: '${DB_USERNAME:-job_user}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-root}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    volumes:
      - 'mysql_data:/var/lib/mysql'
    networks:
      - job_tracker_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-root}"]
      retries: 5
      timeout: 5s

networks:
  job_tracker_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
